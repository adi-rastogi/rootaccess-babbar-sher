version: '3.8'

services:
  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: pollutionmitra
      POSTGRES_PASSWORD: change_this_secure_password
      POSTGRES_DB: pollutionmitra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init_postgis.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollutionmitra -d pollutionmitra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

